services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hiredai
      POSTGRES_USER: hiredai
      POSTGRES_PASSWORD: hiredai
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiredai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hiredai
      DB_USER: hiredai
      DB_PASSWORD: hiredai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-rotate-in-prod}
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - resume-data:/app/data/resumes

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  resume-data:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — re-resolve backend on each request instead of
    # caching its IP at nginx startup (avoids 502s after backend is recreated).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        # No path appended here: with a variable, nginx passes the original
        # request URI as-is (unlike static proxy_pass, which rewrites it).
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
